name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    name: 前端构建 (Vite + Vue 3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - name: 类型检查（不阻断基线）
        run: npm run typecheck || echo "::warning::typecheck 有告警，详见日志"
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: dist/

  rust-check:
    name: Rust 编译检查 (Tauri 2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 安装 Linux 系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf pkg-config libasound2-dev libdbus-1-dev
      - name: 准备 frontendDist
        run: |
          mkdir -p dist
          printf '<!doctype html><title>GoMusic</title>' > dist/index.html
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo check
        shell: bash
        run: |
          set -o pipefail
          cargo check --manifest-path src-tauri/Cargo.toml 2>&1 | tee cargo-check.log
      - name: 暴露编译错误为 annotation
        if: failure()
        shell: bash
        run: |
          grep -E 'error\[|^error:|could not compile|no matching package|failed to (run|build|download)|cannot find' cargo-check.log | head -45 | while IFS= read -r line; do
            printf '::error::%s\n' "$(printf '%s' "$line" | cut -c1-500 | tr '\n' ' ')"
          done
          true


  verify:
    name: 配置 / 凭据 / 参考资源校验
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: JSON 配置与版本一致性
        run: |
          node -e "
            const fs=require('fs');
            for (const f of ['package.json','src-tauri/tauri.conf.json','src-tauri/capabilities/default.json','version.json']) JSON.parse(fs.readFileSync(f,'utf8'));
            const v=JSON.parse(fs.readFileSync('version.json','utf8')).version;
            const p=JSON.parse(fs.readFileSync('package.json','utf8')).version;
            const t=JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json','utf8')).version;
            const c=/^version = \"(.*)\"$/m.exec(fs.readFileSync('src-tauri/Cargo.toml','utf8'))[1];
            const ts=/APP_VERSION = '(.*)'/.exec(fs.readFileSync('src/version.ts','utf8'))[1];
            const set=[v,p,t,c,ts];
            if (new Set(set).size !== 1) { console.error('版本不一致', set); process.exit(1) }
            console.log('版本一致:', v);
          "
      - name: 凭据泄漏扫描
        run: |
          if git grep -nE 'ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}' -- . ':!docs' ; then
            echo "::error::仓库中发现凭据"; exit 1
          fi
          echo "未发现凭据"
      - name: 参考文件校验和（缺失只告警）
        run: |
          cd src-tauri/resources/reference
          if [ -f SHA256SUMS ]; then
            sha256sum -c SHA256SUMS || echo "::warning::部分参考资源缺失或与上游不一致，见 reference/README.md"
          fi
