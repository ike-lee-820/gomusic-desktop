[package]
name = "gomusic-desktop"
version = "26.11.2"
description = "GoMusic desktop client"
authors = ["ike-lee-820"]
edition = "2021"
rust-version = "1.90"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-http = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "fs", "time", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "cookies", "gzip", "brotli", "json"] }
thiserror = "2"
anyhow = "1"
tracing = "0.1"
dirs = "6"

# 后续接入（见 README「与文档的差异」）：
# symphonia / cpal / lofty / walkdir / image / rustfft / realfft /
# rusqlite / souvlaki / keyring / ffmpeg-next / tauri-plugin-{sql,updater,
# single-instance,cli,global-shortcut,autostart}

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
codegen-units = 1
lto = true
strip = true
