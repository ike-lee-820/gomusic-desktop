<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>GoMusic 飘雪参考实现</title>
<style>
  html,body{margin:0;padding:0;width:100%;height:100%;background:transparent;overflow:hidden}
  canvas{display:block;width:100%;height:100%;background:transparent}
</style>
</head>
<body>
<canvas id="snow"></canvas>
<script>
/* 三层精灵：r 3.6/2.1/1.1、speed 78/48/26、alpha .95/.72/.42、
   swayAmp 22/14/8、drift 100/74/50、spawn .18/.32/.50。
   径向渐变四段色标、reset/update/render、drive() 的 breathe 与 clamp、
   三路 lerp 0.28/0.20/0.16 一字不改。Web Audio AnalyserNode 原生可用。 */
const LAYERS = [
  { r: 3.6, speed: 78, alpha: 0.95, swayAmp: 22, drift: 100, spawn: 0.18 },
  { r: 2.1, speed: 48, alpha: 0.72, swayAmp: 14, drift: 74,  spawn: 0.32 },
  { r: 1.1, speed: 26, alpha: 0.42, swayAmp: 8,  drift: 50,  spawn: 0.50 }
];
const canvas = document.getElementById('snow');
const ctx = canvas.getContext('2d');
let W = 0, H = 0, DPR = 1, flakes = [], last = 0, breathe = 0;
let bass = 0, mid = 0, high = 0, spectrum = [0, 0, 0];

function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = canvas.clientWidth || window.innerWidth;
  H = canvas.clientHeight || window.innerHeight;
  canvas.width = Math.floor(W * DPR);
  canvas.height = Math.floor(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener('resize', resize);
resize();

function gradient(r, alpha) {
  const g = ctx.createRadialGradient(0, 0, 0, 0, 0, r);
  g.addColorStop(0.00, 'rgba(255,255,255,' + alpha + ')');
  g.addColorStop(0.35, 'rgba(255,255,255,' + (alpha * 0.86) + ')');
  g.addColorStop(0.72, 'rgba(226,238,255,' + (alpha * 0.34) + ')');
  g.addColorStop(1.00, 'rgba(226,238,255,0)');
  return g;
}

function reset(f, layer, first) {
  f.layer = layer;
  f.x = Math.random() * W;
  f.y = first ? Math.random() * H : -layer.r * 2;
  f.r = layer.r * (0.72 + Math.random() * 0.56);
  f.vy = layer.speed * (0.86 + Math.random() * 0.28);
  f.vx = (Math.random() - 0.5) * layer.drift;
  f.phase = Math.random() * Math.PI * 2;
  f.sway = layer.swayAmp;
  f.alpha = layer.alpha;
  return f;
}
for (const layer of LAYERS) {
  const count = Math.max(12, Math.floor((W * H) / 5200 * layer.spawn));
  for (let i = 0; i < count; i++) flakes.push(reset({}, layer, true));
}

function lerp(a, b, t) { return a + (b - a) * t; }

function drive(dt) {
  // 三路 lerp 0.28 / 0.20 / 0.16；breathe 控制整体亮度，clamp 防越界
  bass = lerp(bass, spectrum[0], 0.28);
  mid = lerp(mid, spectrum[1], 0.20);
  high = lerp(high, spectrum[2], 0.16);
  breathe = Math.min(1, Math.max(0, breathe + dt * (0.4 + bass * 1.6) * (Math.sin(performance.now() / 900) > 0 ? 1 : -1)));
  const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
  return clamp(0.55 + breathe * 0.45 + mid * 0.3, 0.35, 1.25);
}

function update(dt, energy) {
  for (const f of flakes) {
    f.y += f.vy * dt * energy;
    f.x += (f.vx + Math.sin(f.phase + f.y / 60) * f.sway) * dt;
    f.phase += dt * 0.8;
    if (f.y > H + f.r * 2 || f.x < -f.r * 3 || f.x > W + f.r * 3) reset(f, f.layer, false);
  }
}

function render(energy) {
  ctx.clearRect(0, 0, W, H);
  for (const f of flakes) {
    ctx.save();
    ctx.translate(f.x, f.y);
    ctx.globalAlpha = Math.min(1, f.alpha * energy);
    ctx.fillStyle = gradient(f.r, f.alpha);
    ctx.beginPath();
    ctx.arc(0, 0, f.r, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
}

function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000 || 0.016);
  last = now;
  const energy = drive(dt);
  update(dt, energy);
  render(energy);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* Web Audio AnalyserNode：桌面 WebView 原生可用；父页面也通过 postMessage 推
   Rust rustfft 的 {bass,mid,high} 保持与录制帧同步。 */
window.addEventListener('message', (e) => {
  const d = e.data;
  if (!d || d.type !== 'spectrum') return;
  spectrum = [Number(d.bass) || 0, Number(d.mid) || 0, Number(d.high) || 0];
});
try {
  const AC = window.AudioContext || window.webkitAudioContext;
  if (AC) {
    const ac = new AC();
    const analyser = ac.createAnalyser();
    analyser.fftSize = 2048;
    const buf = new Uint8Array(analyser.frequencyBinCount);
    const tick = () => {
      analyser.getByteFrequencyData(buf);
      const band = (lo, hi) => {
        let s = 0, n = 0;
        for (let i = lo; i < hi; i++) { s += buf[i]; n++ }
        return n ? s / n / 255 : 0;
      };
      spectrum = [band(0, 12), band(12, 96), band(96, 480)];
      requestAnimationFrame(tick);
    };
    tick();
  }
} catch (e) { /* 无音频设备时沿用父页面频谱 */ }
</script>
</body>
</html>
